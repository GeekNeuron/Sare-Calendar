<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>گاهشمار سره | Sare Calendar</title>
<meta name="description" content="گاهشمار سرهٔ جلالی — رخدادها و فرویش‌های ایران، همراه با روزشمار ترسایی">
<meta name="theme-color" content="#16575A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="assets/style.css">
<script>
if (localStorage.getItem("sareTheme") === "dark") document.documentElement.classList.add("dark");
</script>
</head>
<body>

<div class="frame">
  <header class="topbar">
    <div class="topbar-row">
      <button class="tools-btn" id="tools-btn" aria-label="ابزارها">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      </button>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="brand-text">
          <h1>گاهشمار سره</h1>
          <span class="brand-en">Sare Calendar</span>
        </div>
      </div>
      <button class="theme-toggle" id="theme-toggle" aria-label="تغییر پوسته"></button>
    </div>
    <div class="today-box">
      <span class="clock-pill" id="clock-pill"></span>
    </div>
  </header>

  <nav class="month-nav">
    <button class="nav-btn" id="prev-btn" aria-label="ماه پیشین">‹ ماه پیشین</button>
    <div class="month-title">
      <span class="month-name" id="month-name">—</span>
      <span class="year-name" id="year-name">—</span>
    </div>
    <button class="nav-btn" id="next-btn" aria-label="ماه پسین">ماه پسین ›</button>
  </nav>

  <div class="today-row" id="today-row">
    <button class="today-btn" id="today-btn">برو به امروز</button>
  </div>

  <main class="grid" id="grid" data-jy="" data-jm=""></main>

  <div class="day-detail" id="day-detail"></div>

  <div class="fact-card" id="fact-card">
    <span class="fact-label">جمله‌ی امروز</span>
    <p class="fact-text" id="fact-text"></p>
  </div>

  <div class="fact-card proverb-card" id="proverb-card">
    <span class="fact-label">مثل روز</span>
    <p class="fact-text" id="proverb-text"></p>
  </div>

  <footer class="foot-note">
    <p>روزهای <span class="dot holiday-dot"></span> فرویش‌اند.</p>
    <p class="tiny">واژه‌یاب سره با بهره از پایگاه‌داده‌ی «پاسبان» (<a href="https://github.com/keyaruga33/pasban_db" target="_blank" rel="noopener">Pasban</a>)</p>
  </footer>
</div>

<div class="menu-overlay" id="menu-overlay"></div>
<aside class="side-menu" id="side-menu">
  <div class="side-menu-header">
    <h2>ابزارها</h2>
    <button class="side-menu-close" id="menu-close" aria-label="بستن">×</button>
  </div>
  <div class="tool-list" id="tool-list"></div>
</aside>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title"></h2>
      <button class="modal-close" id="modal-close" aria-label="بستن">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script src="assets/events-data.js"></script>
<script src="assets/events-regional.js"></script>
<script src="assets/event-context.js"></script>
<script src="assets/history-facts.js"></script>
<script src="assets/proverbs.js"></script>
<script src="assets/pasban-words.js"></script>
<script type="module" src="assets/app.js"></script>
</body>
</html>
